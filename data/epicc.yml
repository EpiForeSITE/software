tool_name: 'EPICC: Epidemiological Cost Calculator'
tool_description: EPICC is a Streamlit web application for estimating and comparing the
  economic cost of outbreak scenarios. Users pick a disease (measles and tuberculosis
  presets are included), adjust the pre-populated cost and outbreak parameters, and
  compare multiple scenarios side by side. Parameter sets can be authored and exchanged
  as YAML or XLSX files, are validated against a generated Pydantic model, and results
  can be exported as a shareable report for public health officials and other
  decision makers.
