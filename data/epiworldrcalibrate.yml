tool_name: 'epiworldRcalibrate: Fast and Effortless Calibration of Agent-Based Models
  using Machine Learning'
tool_description: Provides tools and pre-trained Machine Learning [ML] models for
  calibration of Agent-Based Models [ABMs] built with the R package 'epiworldR'.
  Implements methods described in Najafzadehkhoei, Vega Yon, Modenesi, and Meyer
  (2025) <doi:10.48550/arXiv.2509.07013>. Users can automatically calibrate ABMs in
  seconds with pre-trained ML models, effectively focusing on simulation rather than
  calibration. Bridges a gap by allowing public health practitioners to run their own
  ABMs without the advanced technical expertise often required by calibration.
